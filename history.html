<!doctype html>
<meta charset="utf-8">
<title>История цен — Ozon TMS watcher</title>
<style>
  body{font:14px system-ui;max-width:900px;margin:20px auto;padding:0 16px;color:#222}
  .ride{border:1px solid #ccc;border-radius:8px;padding:10px 14px;margin:10px 0}
  .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .route{font-weight:600} .live{color:#2e7d32;font-size:12px} .gone{color:#888;font-size:12px}
  .meta{color:#555;font-size:12px;margin:2px 0 6px}
  .stats span{margin-right:14px}
  .up{color:#c62828}.down{color:#2e7d32}
  svg{width:100%;height:60px;background:#f6f8fa;border-radius:4px;margin-top:6px}
  details{margin-top:6px} table{border-collapse:collapse;font-size:12px} td,th{padding:2px 10px;text-align:left}
  #empty{color:#666}
</style>
<h2>История цен подходящих рейсов</h2>
<p><label><input type="checkbox" id="onlyLive"> только рейсы, которые сейчас в списке</label>
 <button id="clear" style="margin-left:16px">Очистить историю</button></p>
<div id="list"></div><div id="empty"></div>
<script type="module" src="history.js"></script>
