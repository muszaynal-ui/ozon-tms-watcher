<!doctype html>
<meta charset="utf-8">
<style>
  body{font:13px system-ui;width:330px;padding:12px;margin:0}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  button{padding:6px 10px;margin:3px 4px 3px 0;cursor:pointer}
  #state{padding:8px;background:#f4f6f8;border-radius:6px;margin:8px 0;line-height:1.5}
  .err{color:#c62828}.ok{color:#2e7d32}
  hr{border:0;border-top:1px solid #ddd;margin:10px 0}
  small{color:#666}
</style>
<div class="row"><label><input type="checkbox" id="enabled"> <b>Мониторинг включён</b></label></div>
<div id="state">…</div>
<button id="settings">Настройки (маршруты, Telegram, WhatsApp)</button>
<button id="reset">Сбросить «виденные»</button>
<hr>
<div>Версия <b id="ver"></b> · <span id="updInfo">не проверено</span></div>
<button id="chk">Проверить обновление</button> <button id="doUpd" disabled>Обновить</button>
<div><a href="#" id="upd">Настройки обновления</a> · <a href="#" id="diag">Диагностика</a></div>
<div id="status"></div>
<script type="module" src="popup.js"></script>
